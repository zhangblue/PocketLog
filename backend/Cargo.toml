[package]
name = "pocket-log-backend"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "=0.8.4"
sea-orm = { version = "=1.1.14", features = ["sqlx-postgres", "runtime-tokio-rustls", "with-uuid", "with-chrono", "with-rust_decimal"] }
sea-orm-migration = { version = "=1.1.14", features = ["sqlx-postgres", "runtime-tokio-rustls"] }
sea-orm-macros = "=1.1.14"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
http-body-util = "0.1"
chrono = { version = "0.4", features = ["serde"] }
rust_decimal = { version = "1", features = ["serde"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "fs", "limit", "request-id", "timeout", "trace"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["serde", "v4"] }
thiserror = "2"
async-trait = "0.1"
toml = "0.8"
